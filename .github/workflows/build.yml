name: Build Tuoke APK
# 触发条件：
#  1) 手动点击 Actions 里的 Run workflow
#  2) push 到 main / master 分支
#  3) 打 tag（会自动把 APK 挂到 Release）
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
permissions:
  contents: write
jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # ---------- 1. 拉代码 ----------
      - name: Checkout
        uses: actions/checkout@v4
      # ---------- 2. 装 JDK 17 ----------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ---------- 3. 缓存 Gradle ----------
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      # ---------- 4. 安装完整 Gradle 8.2（不依赖 wrapper jar）----------
      - name: Install Gradle 8.2
        run: |
          set -x
          GRADLE_VER=8.2
          curl -fsSL -o /tmp/gradle.zip \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip"
          sudo unzip -q -o /tmp/gradle.zip -d /opt
          sudo ln -sf /opt/gradle-${GRADLE_VER}/bin/gradle /usr/local/bin/gradle
          gradle -v
      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4
      # ---------- 5. 写入 local.properties（泡椒云凭据）----------
      - name: Write local.properties
        run: |
          cat > local.properties <<'EOF'
          PAOJIAOYUN_APP_KEY=dakv2fjdqusrvvk1kaag
          PAOJIAOYUN_APP_SECRET=U5w2trh9FZIzXYiUHLWTutiKsImFQ49n
          EOF
          echo "local.properties 已生成："
          sed 's/\(SECRET=\).*/\1***隐藏***/' local.properties
      # ---------- 6. 编译 ----------
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      # ---------- 7. 上传产物 ----------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tuoke-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      # ---------- 8. 打 tag 时附到 Release ----------
      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk