plugins {
    id 'com.android.application'
}

android {
    namespace 'com.luoqi.tuoke'
    compileSdk 34

    defaultConfig {
        applicationId "com.luoqi.tuoke"
        minSdk 24
        targetSdk 34
        // ---------- 版本号自动跟随 Git tag ----------
        // 优先读取 CI 注入的环境变量(TAG_NAME)，其次读本地 git describe，兜底 1.0.0
        def rawTag = System.getenv('TAG_NAME')
        if (rawTag == null || rawTag.trim().isEmpty()) {
            try {
                def p = new ByteArrayOutputStream()
                exec {
                    commandLine 'git', 'describe', '--tags', '--abbrev=0'
                    standardOutput = p
                }
                rawTag = p.toString().trim()
            } catch (Throwable ignored) {
                rawTag = 'v1.0.0'
            }
        }
        // 去掉前缀 v，拆成 主.次.修 三段
        def verName = rawTag.replaceAll('^v', '').trim()
        if (!verName.matches('\\d+(\\.\\d+){0,3}')) verName = '1.0.0'
        def verSegs = verName.tokenize('.').collect { it.isInteger() ? it.toInteger() : 0 }
        while (verSegs.size() < 3) verSegs << 0
        // versionCode = 主*10000 + 次*100 + 修（保证递增）
        def verCode = verSegs[0] * 10000 + verSegs[1] * 100 + verSegs[2]
        versionCode verCode
        versionName verName
        println "==> Tuoke 版本号: tag=${rawTag} versionName=${verName} versionCode=${verCode}"

        // ---------- 泡椒云凭据注入 ----------
        def localProps = new Properties()
        def localPropsFile = rootProject.file('local.properties')
        if (localPropsFile.exists()) {
            localPropsFile.withInputStream { localProps.load(it) }
        }
        def pjKey = (localProps.getProperty('PAOJIAOYUN_APP_KEY')
                ?: project.findProperty('PAOJIAOYUN_APP_KEY')
                ?: System.getenv('PAOJIAOYUN_APP_KEY') ?: '').toString().trim()
        def pjSecret = (localProps.getProperty('PAOJIAOYUN_APP_SECRET')
                ?: project.findProperty('PAOJIAOYUN_APP_SECRET')
                ?: System.getenv('PAOJIAOYUN_APP_SECRET') ?: '').toString().trim()

        // AppSecret 混淆：反转 + 分片 + Base64（提高逆向门槛，非强加密）
        def obfuscate = { String plain, int parts ->
            if (plain == null || plain.isEmpty()) return []
            def reversed = plain.reverse()
            int len = reversed.length()
            int chunk = (int) Math.ceil(len / (double) parts)
            def out = []
            for (int i = 0; i < len; i += chunk) {
                int end = Math.min(i + chunk, len)
                out << reversed.substring(i, end).getBytes('UTF-8')
                        .encodeBase64().toString()
            }
            return out
        }
        def keyParts = obfuscate(pjKey, 3)
        def secretParts = obfuscate(pjSecret, 5)
        def toJavaArray = { List<String> arr ->
            return "{ " + arr.collect { "\"${it}\"" }.join(", ") + " }"
        }

        buildConfigField "String[]", "PJ_KEY_PARTS", toJavaArray(keyParts)
        buildConfigField "String[]", "PJ_SECRET_PARTS", toJavaArray(secretParts)
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}